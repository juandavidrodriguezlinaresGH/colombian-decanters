<section class="categories-section container py-5" id="categorias">
  @if (selectedCategory; as category) {
    <div class="category-detail text-center">
      <a class="back-link" routerLink="/" fragment="categories">← Volver a categorías</a>
      <h1 class="category-title mt-3">{{ category.name }}</h1>
      <img class="category-detail-image img-fluid" [src]="category.image" [alt]="category.name" />
      <p class="mt-3">{{ category.description }}</p>
      <p class="category-placeholder">Aquí podrás mostrar los productos de esta categoría.</p>
    </div>
  } @else {
    <h2 class="category-heading text-center mb-4">Categorias</h2>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
      @for (category of categories; track category.slug) {
        <div class="col">
          <a
            class="category-card"
            [routerLink]="['/categories', category.slug]"
            [attr.aria-label]="'Ver categoría ' + category.name"
          >
            <img [src]="category.image" [alt]="category.name" loading="lazy" />
            <span class="category-overlay"></span>
            <span class="category-name">{{ category.name }}</span>
          </a>
        </div>
      }
    </div>
  }
</section>
